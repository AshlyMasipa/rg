packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ only runs install scripts for packages listed as true here.
allowBuilds:
  better-sqlite3: true      # server: needs its native SQLite binary
  esbuild: true             # tsx / vitest
  "@google/genai": false    # ai: no build step needed
  protobufjs: false         # ai (via @google/genai): postinstall is only a version check
